name: Update NVD Database

on:
  schedule:
    # Daily, finished well before the docker-ci nightly OWASP image build (02:11 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-nvd
  cancel-in-progress: false

jobs:
  update-nvd:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    permissions:
      contents: write   # publish the release asset
      actions: write    # keep-alive: re-enable this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Restore NVD database cache
        id: nvd-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/dc-data
          key: nvd-data-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            nvd-data-${{ runner.os }}-

      - name: Seed from last release if no cache
        # Caches get evicted (7 days unused / 10 GB repo limit); the last published database
        # is just as good a starting point, so a full ~5 h NVD download only ever happens once.
        if: steps.nvd-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p seed && cd seed
          if gh release download nvd-data-latest -p 'nvd-database.tar.gz*' && sha256sum -c nvd-database.tar.gz.sha256; then
            tar -xzf nvd-database.tar.gz -C "$GITHUB_WORKSPACE"
            echo "Seeded dc-data from the nvd-data-latest release"
          else
            echo "::warning::No cache and no usable release; doing a full NVD download"
          fi
          cd .. && rm -rf seed

      - name: Download/Update NVD Database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:update-only \
            -DnvdApiKey="$NVD_API_KEY" \
            -DnvdApiDelay=500 \
            -DdataDirectory="$GITHUB_WORKSPACE/dc-data"

      - name: Save NVD database cache
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/dc-data
          key: nvd-data-${{ runner.os }}-${{ steps.date.outputs.date }}

      - name: Prune older NVD caches
        # Every run saves a new ~115 MB cache; keep only the newest two
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key "nvd-data-${{ runner.os }}-" --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
            | xargs -r -n1 gh cache delete

      - name: Compress database
        run: |
          tar -czf nvd-database.tar.gz -C "$GITHUB_WORKSPACE" dc-data
          sha256sum nvd-database.tar.gz > nvd-database.tar.gz.sha256

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace the assets in place so the download URL never 404s mid-update
          if gh release view nvd-data-latest >/dev/null 2>&1; then
            gh release upload nvd-data-latest nvd-database.tar.gz nvd-database.tar.gz.sha256 --clobber
            gh release edit nvd-data-latest --notes "Updated $(date -u +'%Y-%m-%d %H:%M UTC') by run ${{ github.run_id }}"
          else
            gh release create nvd-data-latest \
              --title "NVD Database Latest" \
              --notes "Updated $(date -u +'%Y-%m-%d %H:%M UTC') by run ${{ github.run_id }}" \
              nvd-database.tar.gz nvd-database.tar.gz.sha256
          fi

      - name: Keep scheduled workflow alive
        # GitHub disables scheduled workflows after 60 days without repository activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-nvd-database.yml/enable"
